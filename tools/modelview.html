<!doctype html><html><body style="margin:0;background:#89a"><script type="module">
// dev helper: /tools/modelview.html?m=gm_arch&yaw=0.6&pitch=0.25 renders public/assets/<m>.glb
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color('#9ab');
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment()).texture;
s.add(new THREE.DirectionalLight('#fff', 2).translateX(2).translateY(3).translateZ(2));
const g = (await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(`/assets/${q.get('m')}.glb`)).scene; s.add(g);
const b = new THREE.Box3().setFromObject(g), c = b.getCenter(new THREE.Vector3()), R = b.getSize(new THREE.Vector3()).length();
const yaw = +(q.get('yaw') ?? 0.6), pitch = +(q.get('pitch') ?? 0.25);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.set(c.x + Math.sin(yaw) * Math.cos(pitch) * R * 1.6, c.y + Math.sin(pitch) * R * 1.6, c.z + Math.cos(yaw) * Math.cos(pitch) * R * 1.6); cam.lookAt(c);
r.render(s, cam); window.__done = JSON.stringify({ min: b.min.toArray().map((v) => +v.toFixed(3)), max: b.max.toArray().map((v) => +v.toFixed(3)) });
</script></body></html>
